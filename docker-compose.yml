services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee
      POSTGRES_DB: employee_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U employee -d employee_management']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '8080:3000'
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: employee
      DB_PASSWORD: employee
      DB_NAME: employee_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

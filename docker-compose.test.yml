services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee
      POSTGRES_DB: employees_test
    ports:
      - '5433:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U employee -d employees_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_test:

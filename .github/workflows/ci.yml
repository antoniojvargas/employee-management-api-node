name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: employee
          POSTGRES_PASSWORD: employee
          POSTGRES_DB: employees_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U employee -d employees_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: employee
      DB_PASSWORD: employee
      DB_NAME: employees_test
      JWT_SECRET: test-secret-cambiar-en-produccion
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin1234

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: Run tests
        run: npm test
